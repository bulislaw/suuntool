services:
  suuntool:
    build:
      context: .
      dockerfile: Dockerfile
    image: suuntool:local
    pull_policy: build
    restart: unless-stopped
    environment:
      SUUNTOOL_MCP_TOKEN: ${SUUNTOOL_MCP_TOKEN:?Set a random MCP bearer token}
    ports:
      - "${SUUNTOOL_BIND_ADDRESS:-127.0.0.1}:${SUUNTOOL_PORT:-8080}:8080"
    networks:
      - default
      - proxy
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

volumes:
  data:
